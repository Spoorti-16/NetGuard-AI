{% extends 'base.html' %}{% block title %}Login{% endblock %}
{% block content %}
<div class="card auth" style="max-width:440px;margin:40px auto;padding:24px;border:1px solid #334155;border-radius:10px">
  <h2 style="margin-top:0">&#128274; Network Authentication</h2>
  <p class="small mute">Authenticate your credentials to connect your host to its assigned switch &amp; router slot.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if request.args.get('next') %}
    <input type="hidden" name="next" value="{{ request.args.get('next') }}">
    {% endif %}
    <div style="margin-bottom:12px">
      <label>Username</label>
      <input name="username" required autofocus style="width:100%" placeholder="Enter your registered username">
    </div>
    <div style="margin-bottom:16px">
      <label>Password</label>
      <input type="password" name="password" required style="width:100%" placeholder="Enter your password">
    </div>
    <p style="display:flex;justify-content:space-between;align-items:center;margin:0">
      <button class="ok">&#128275; Authenticate &amp; Enter</button>
      <a class="small" href="{{ url_for('register') }}">Create new account</a>
    </p>
  </form>
</div>
{% endblock %}
